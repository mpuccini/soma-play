[package]
name = "soma-player"
version = "0.1.4"
edition = "2024"
authors = ["Marco Puccini <mpuccini@example.com>"]
description = "A terminal-based music player for SomaFM internet radio stations with spectrum visualizer"
license = "MIT OR Apache-2.0"
repository = "https://github.com/mpuccini/soma-play"
homepage = "https://github.com/mpuccini/soma-play"
documentation = "https://mpuccini.github.io/soma-play/"
readme = "README.md"
keywords = ["music", "radio", "terminal", "tui", "somafm"]
categories = ["multimedia::audio", "command-line-utilities"]
exclude = [
    "/.github/",
    "/docs/",
    "/site/",
    "/sbom/",
    "/vendor/",
    "*.sh",
    ".gitignore"
]

# Add these for better release builds
[profile.release]
opt-level = 3        # Maximum optimization
lto = true          # Link-time optimization
codegen-units = 1   # Better optimization
panic = "abort"     # Smaller binary size
strip = true        # Remove debug symbols

[dependencies]
reqwest = { version = "0.12", features = ["json", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rodio = "0.19"
tokio = { version = "1.38", features = ["full"] }
symphonia = { version = "0.5.3", features = ["mp3"] }
crossterm = "0.27"
icy-metadata = "0.2"
stream-download = { version = "0.10", features = ["reqwest"] }
ratatui = "0.28"
color-eyre = "0.6"
toml = "0.8"
dirs = "5.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"
rand = "0.8"
clap = { version = "4.5", features = ["derive"] }
libc = "0.2"

[dev-dependencies]
tempfile = "3.8"
tokio-test = "0.4"

# Local fork of icy-metadata 0.2.1 with a bounds fix in `parse_next_metadata`.
# Upstream panics when a stream's metaint exceeds the decoder's read buffer
# (e.g. SomaFM's Sonic Universe). Drop this patch once the fix lands upstream.
[patch.crates-io]
icy-metadata = { path = "vendor/icy-metadata" }
